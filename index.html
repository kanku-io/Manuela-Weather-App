<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manuela</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Italiana&family=Inter:wght@100;200;300;400&family=Outfit:wght@200;300;400&family=Space+Grotesk:wght@300;400&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app-container">

        <div id="search-bar">
            <div class="left">
                <p class="dec1">WEATHER</p>
                <hr>
                <h2 class="title"><span class="one">MANU</span><span class="two">ELA</span></h2>
                <hr>
                <p class="dec2">APP</p>
            </div>
            <div class="center">
                <div class="search-wrap">
                    <input type="text" id="search-input" placeholder="Search city..." autocomplete="off">
                    <button id="search-btn"><i class="fa-solid fa-magnifying-glass"></i></button>
                    <div id="suggestions"></div>
                </div>
            </div>
            <div class="right">
                <button class="btn active" id="celsius">°C</button>
                <button class="btn" id="fahrenheit">°F</button>
            </div>
        </div>

        <div class="layout">

            <div class="summary stat-card" id="summary">
                <div class="stat-header">
                    <i class="fa-solid fa-map-pin"></i>
                    <h3 id="city-country">Johannesburg, ZA</h3>
                </div>
                <div class="summary-main">
                    <h1 id="temp">—</h1>
                    <p id="weather-condition">—</p>
                </div>
                <div id="temp-max-min">
                    <p id="temp-high">H: —</p>
                    <p id="temp-low">L: —</p>
                </div>
            </div>

            <div class="humidity stat-card">
                <div class="stat-header">
                    <i class="fa-solid fa-droplet"></i>
                    <h3>HUMIDITY</h3>
                </div>
                <h1 id="humid-percent">—</h1>
                <p id="humid-text">—</p>
            </div>

            <div class="wind stat-card">
                <div class="stat-header">
                    <i class="fa-solid fa-wind"></i>
                    <h3>WIND</h3>
                </div>
                <h1 id="wind-speed"><span class="wind-spd">—</span>km/h</h1>
                <p id="wind-direction">—</p>
            </div>

            <div class="feels-like stat-card">
                <div class="stat-header">
                    <i class="fa-solid fa-person"></i>
                    <h3>FEELS LIKE</h3>
                </div>
                <h1 id="fl-temp">—</h1>
                <p id="fl-text">—</p>
            </div>

            <div class="cloud-cover stat-card">
                <div class="stat-header">
                    <i class="fa-solid fa-cloud"></i>
                    <h3>CLOUD COVER</h3>
                </div>
                <h1 id="cloud-value">—</h1>
                <p id="cloud-text">—</p>
            </div>

            <div class="hourly-forecast stat-card">
                <div class="stat-header">
                    <i class="fa-regular fa-clock"></i>
                    <h3>HOURLY FORECAST</h3>
                </div>
                <div class="hourly-strip" id="hourly-strip"></div>
            </div>

            <div class="five-day-forecast stat-card">
                <div class="stat-header">
                    <i class="fa-regular fa-calendar"></i>
                    <h3>5-DAY FORECAST</h3>
                </div>
                <ul class="forecast-list" id="forecast-list"></ul>
            </div>

        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
